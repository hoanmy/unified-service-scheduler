# application-dev.properties — Development profile overrides
# Activated automatically in quarkus:dev mode

# ── Verbose logging in dev ────────────────────────────────────────────────────
quarkus.log.level=DEBUG
quarkus.log.category."com.keyloop".level=DEBUG
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.log.bind-parameters=true

# ── Disable DB constraint during test migration resets ────────────────────────
# quarkus.flyway.clean-at-start=true  # Uncomment to reset DB on each dev restart

# ── Dev mode: include Swagger UI always ───────────────────────────────────────
quarkus.swagger-ui.always-include=true

# ── Dev services (auto-start containers if not using docker-compose) ──────────
# Quarkus Dev Services can auto-start infrastructure for dev/test.
# Set to false if you are managing containers via docker-compose.dev.yml
quarkus.devservices.enabled=false

# ── In dev mode, relax CORS ───────────────────────────────────────────────────
quarkus.http.cors=true
quarkus.http.cors.origins=*

# ── OpenTelemetry — disable in dev to avoid needing OTEL collector ────────────
quarkus.otel.traces.enabled=false
