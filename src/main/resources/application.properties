# ─────────────────────────────────────────────────────────
# Quarkus Application Configuration
# unified-service-scheduler
# ─────────────────────────────────────────────────────────

# ── Application Identity ──────────────────────────────────
quarkus.application.name=unified-service-scheduler
quarkus.application.version=1.0.0-SNAPSHOT

# ── OpenAPI / Swagger UI ───────────────────────────────────
quarkus.smallrye-openapi.info-title=Unified Service Scheduler API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Enterprise-grade reactive backend for Keyloop Automotive Retail Platform. Manages service appointment reservations with real-time bay/technician availability. Architecture: CQRS + Clean Architecture + Transactional Outbox + EDA.
quarkus.smallrye-openapi.info-contact-email=platform@keyloop.com
quarkus.smallrye-openapi.info-contact-name=Keyloop Platform Team
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# ── HTTP Server ───────────────────────────────────────────
quarkus.http.port=8080
quarkus.http.access-log.enabled=true
quarkus.http.access-log.pattern=combined
quarkus.http.cors=true
quarkus.http.cors.origins=/.*/

# ── Logging ───────────────────────────────────────────────
quarkus.log.level=INFO
quarkus.log.category."com.keyloop".level=DEBUG
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n
quarkus.log.console.json=false

# ─────────────────────────────────────────────────────────
# PostgreSQL — Primary Datasource (ACID Transactions)
# ─────────────────────────────────────────────────────────
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:scheduler_user}
quarkus.datasource.password=${DB_PASSWORD:scheduler_pass}
quarkus.datasource.reactive.url=vertx-reactive:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:scheduler_db}
quarkus.datasource.reactive.max-size=20
quarkus.datasource.reactive.idle-timeout=PT5M
quarkus.datasource.reactive.pool-cleaner-period=PT30S

# JDBC datasource for Flyway migrations (non-reactive)
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:scheduler_db}
quarkus.datasource.jdbc.max-size=5

# ── Hibernate Reactive ────────────────────────────────────
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.log.bind-parameters=false

# ── Flyway ────────────────────────────────────────────────
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.validate-on-migrate=true

# ─────────────────────────────────────────────────────────
# Redis — Distributed Lock + Idempotency Cache
# ─────────────────────────────────────────────────────────
quarkus.redis.hosts=${REDIS_URL:redis://localhost:6379}
quarkus.redis.timeout=PT3S
quarkus.redis.max-pool-size=50
quarkus.redis.max-pool-waiting=200

# ─────────────────────────────────────────────────────────
# Elasticsearch — CQRS Read Side
# ─────────────────────────────────────────────────────────
quarkus.elasticsearch.hosts=${ES_HOST:localhost}:${ES_PORT:9200}
quarkus.elasticsearch.protocol=${ES_PROTOCOL:http}
quarkus.elasticsearch.connection-timeout=PT5S
quarkus.elasticsearch.socket-timeout=PT30S
quarkus.elasticsearch.max-connections=100
quarkus.elasticsearch.max-connections-per-route=20

# Index naming strategy: one index per dealership
scheduler.elasticsearch.index-prefix=dealer
scheduler.elasticsearch.availability-index-alias=availability_slots

# ─────────────────────────────────────────────────────────
# Kafka — Event Streaming (SmallRye Reactive Messaging)
# ─────────────────────────────────────────────────────────
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# ── Kafka Topics ──────────────────────────────────────────
scheduler.kafka.topic.appointment-events=appointment-events
scheduler.kafka.topic.availability-sync=availability-sync
scheduler.kafka.topic.notifications=notification-dispatch

# ── Consumer: Search Sync Worker (Consumer Group A) ───────
mp.messaging.incoming.appointment-events-in.connector=smallrye-kafka
mp.messaging.incoming.appointment-events-in.topic=appointment-events
mp.messaging.incoming.appointment-events-in.group.id=search-sync-worker
mp.messaging.incoming.appointment-events-in.auto.offset.reset=earliest
mp.messaging.incoming.appointment-events-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.appointment-events-in.enable.auto.commit=false
mp.messaging.incoming.appointment-events-in.failure-strategy=retry
mp.messaging.incoming.appointment-events-in.retry.attempts=5
mp.messaging.incoming.appointment-events-in.retry.delay=PT1S

# ── Consumer: Notification Worker (Consumer Group B) ──────
mp.messaging.incoming.notification-events-in.connector=smallrye-kafka
mp.messaging.incoming.notification-events-in.topic=appointment-events
mp.messaging.incoming.notification-events-in.group.id=notification-worker
mp.messaging.incoming.notification-events-in.auto.offset.reset=earliest
mp.messaging.incoming.notification-events-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.notification-events-in.enable.auto.commit=false
mp.messaging.incoming.notification-events-in.failure-strategy=retry
mp.messaging.incoming.notification-events-in.retry.attempts=10
mp.messaging.incoming.notification-events-in.retry.delay=PT2S

# ─────────────────────────────────────────────────────────
# Concurrency Control Configuration
# ─────────────────────────────────────────────────────────
# Distributed Lock TTL (seconds) — must exceed max ACID transaction time
scheduler.lock.ttl-seconds=5
# Idempotency key TTL (24h sliding window)
scheduler.idempotency.ttl-seconds=86400

# ─────────────────────────────────────────────────────────
# SmallRye Health
# ─────────────────────────────────────────────────────────
quarkus.smallrye-health.root-path=/q/health
quarkus.smallrye-health.liveness-path=/q/health/live
quarkus.smallrye-health.readiness-path=/q/health/ready

# ─────────────────────────────────────────────────────────
# Metrics (Prometheus)
# ─────────────────────────────────────────────────────────
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics

# ─────────────────────────────────────────────────────────
# OpenTelemetry (Distributed Tracing)
# ─────────────────────────────────────────────────────────
quarkus.otel.exporter.otlp.traces.endpoint=${OTEL_ENDPOINT:http://localhost:4317}
quarkus.otel.traces.enabled=true

# ─────────────────────────────────────────────────────────
# Fault Tolerance (SmallRye / Resilience4j)
# ─────────────────────────────────────────────────────────
# Circuit breaker for Elasticsearch
scheduler.elasticsearch.circuit-breaker.request-volume-threshold=20
scheduler.elasticsearch.circuit-breaker.failure-rate-threshold=50
scheduler.elasticsearch.circuit-breaker.delay-seconds=10
